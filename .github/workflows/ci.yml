name: CI

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --include=dev

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build
